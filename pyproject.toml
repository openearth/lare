[project]
name = "lare"
version = "0.1.0"
description = "Landscape Archetype Restoration Engine - OGC API Processes"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}

dependencies = [
    "pydantic>=2",
    "pyyaml",
    "geopandas",
    "numpy",
    "pandas",
    "shapely",
    "fiona",
    "pyproj",
    "requests",
    "owslib",
    "geojson",
    "sqlalchemy",
    "geoserver-rest",
    "gsconfig-py3",
]

[project.optional-dependencies]
full = [
    "rasterio",
    "scipy",
    "xarray",
    "rioxarray",
    "psutil",
    "psycopg2-binary",
]
dev = [
    "pytest",
    "ipykernel",
]

[tool.hatch.build.targets.wheel]
packages = ["processes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
